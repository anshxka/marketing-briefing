<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFE4EE">
<title>{{TITLE}} · {{DATE}}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF5F8; --card:#FFFFFF; --ink:#3A1430; --muted:#8A5A78; --line:#F7D3E1;
  --rose:#E8457C; --blush:#FFE4EE; --soft:#FFF0F5; --shadow:0 10px 30px -18px rgba(194,24,91,.35);
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1C0E18; --card:#28141F; --ink:#FBE8F1; --muted:#C99AB4; --line:#44243A;
  --blush:#3A1B2F; --soft:#2F1727; --shadow:0 10px 30px -18px rgba(0,0,0,.6);
}}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);
  background-image:radial-gradient(circle at 15% 0%,var(--blush) 0,transparent 40%),radial-gradient(circle at 90% 10%,var(--blush) 0,transparent 35%);
  background-repeat:no-repeat}
.wrap{max-width:1040px;margin:auto;padding:36px 20px 70px}
a{color:inherit}

/* masthead */
header{text-align:center;margin-bottom:30px}
.kicker{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--rose);font-weight:700;margin:0}
h1{font:italic 600 clamp(40px,8vw,72px)/1.05 var(--serif);margin:10px 0 8px;letter-spacing:-.01em}
.date{color:var(--muted);margin:0}
.date b{color:var(--rose);font-weight:500}
.flourish{color:var(--rose);letter-spacing:.6em;margin-top:12px;font-size:14px}

/* top cards */
.top{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;margin-bottom:30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px 26px;box-shadow:var(--shadow)}
.card h2{font:600 22px var(--serif);margin:0 0 12px}
.big{list-style:none;margin:0;padding:0;counter-reset:n}
.big li{counter-increment:n;position:relative;padding:0 0 14px 44px;font:500 17px/1.5 var(--serif)}
.big li::before{content:counter(n);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;
  background:var(--blush);color:var(--rose);font:700 14px/30px var(--sans);text-align:center}
.tip{background:linear-gradient(140deg,#FFD6E5,#FFC1D8 55%,#F9A8C9);color:#4A1033;border:0}
.tip h2{color:#4A1033}
.tip p{margin:0;font-size:16px}
@media (prefers-color-scheme:dark){.tip{background:linear-gradient(140deg,#5A2045,#7A2858);color:#FFE4EE}.tip h2{color:#FFE4EE}}

/* chips */
nav{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:12px 0;margin-bottom:6px;
  background:var(--bg);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.chip{--c:var(--rose);flex:none;font:500 14px var(--sans);color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:8px 15px;cursor:pointer;transition:.15s}
.chip span{color:var(--muted);margin-left:3px}
.chip:hover{border-color:var(--c)}
.chip.on{background:var(--c);border-color:var(--c);color:#fff}.chip.on span{color:#ffffffd0}
.chip:focus-visible,a:focus-visible{outline:2px solid var(--rose);outline-offset:2px}

/* sections */
.cat{margin-top:38px}
.cat>h2{display:flex;align-items:center;gap:12px;font:600 28px var(--serif);margin:0 0 16px}
.cat>h2 i{font-style:normal;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  background:var(--blush);font-size:22px}
.story{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow);
  display:flex;flex-direction:column}
.story.featured{display:grid;grid-template-columns:1fr 1.15fr;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.media{position:relative;aspect-ratio:16/10;background:linear-gradient(135deg,var(--blush),var(--c) 180%);
  display:grid;place-items:center;overflow:hidden}
.featured .media{aspect-ratio:auto;min-height:100%}
.media span{font-size:46px;opacity:.85}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.body{padding:22px 24px 24px}
.story h3{font:600 22px/1.3 var(--serif);margin:0 0 12px}
.featured h3{font-size:27px}
.story p{margin:0 0 12px;color:var(--ink)}
.why{background:var(--soft);border-left:3px solid var(--c);border-radius:12px;padding:12px 14px;margin:14px 0 12px;font-size:15px}
.why b{display:block;color:var(--c);font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:3px}
.src{font-size:14px;color:var(--muted);text-decoration:none}
.src:hover{color:var(--rose)}

/* archive */
.archive{margin-top:50px;text-align:center}
.archive h2{font:italic 600 24px var(--serif);margin:0 0 14px}
.days{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.days a{text-decoration:none;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px}
.days a:hover{border-color:var(--rose);color:var(--rose)}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:34px}

@media (max-width:760px){
  .top{grid-template-columns:1fr}
  .story.featured{grid-template-columns:1fr}
  .featured .media{aspect-ratio:16/10}
  .featured h3{font-size:23px}
  .wrap{padding-top:26px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="kicker">{{TAGLINE}}</p>
    <h1>{{TITLE}}</h1>
    <p class="date">{{DATE}} · <b>{{COUNT}} stories</b></p>
    <div class="flourish">✿ ✿ ✿</div>
  </header>

  <div class="top">
    <div class="card">
      <h2>Today's big picture</h2>
      <ol class="big">{{BIG_PICTURE}}</ol>
    </div>
    <div class="card tip">
      <h2>💡 Tip of the day</h2>
      <p>{{TIP}}</p>
    </div>
  </div>

  <nav>{{CHIPS}}</nav>
  <main>{{SECTIONS}}</main>

  <section class="archive">
    <h2>Past briefings</h2>
    <div class="days">{{ARCHIVE}}</div>
  </section>
  <footer>Updated {{UPDATED}} · Articles are AI-written summaries; open the source before quoting. 🌸</footer>
</div>
<script>
document.querySelectorAll('.chip').forEach(function(c){
  c.addEventListener('click',function(){
    document.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on')});
    c.classList.add('on');
    var k=c.dataset.cat;
    document.querySelectorAll('.cat').forEach(function(s){s.style.display=(k==='all'||s.dataset.cat===k)?'':'none'});
    window.scrollTo({top:document.querySelector('nav').offsetTop,behavior:'smooth'});
  });
});
</script>
</body>
</html>
